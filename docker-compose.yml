version: '3.8'

services:
  # Primary Web & Recommendation Application Server
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workpulse_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - SECRET_KEY=workpulse-production-key-2024
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    volumes:
      - ./data:/app/data
      - ./models/saved:/app/models/saved
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - workpulse_network

  # Background Analytics & Scheduled Pipeline Worker
  analytics_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workpulse_analytics_worker
    restart: unless-stopped
    command: ["python3", "-u", "-c", "import time; print('Analytics worker initialized. Ready for scheduled pipeline jobs.'); [time.sleep(3600) for _ in iter(int, 1)]"]
    environment:
      - FLASK_ENV=production
    volumes:
      - ./data:/app/data
      - ./models/saved:/app/models/saved
      - ./reports:/app/reports
    networks:
      - workpulse_network

networks:
  workpulse_network:
    driver: bridge
